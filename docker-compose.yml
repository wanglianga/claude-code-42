services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petpark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petpark123}
      POSTGRES_DB: ${POSTGRES_DB:-petpark}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal
    # 数据库不发布到宿主端口，仅 compose 内部网络访问

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-petpark}:${POSTGRES_PASSWORD:-petpark123}@db:5432/${POSTGRES_DB:-petpark}
      SECRET_KEY: ${SECRET_KEY:-please-change-me-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      UPLOAD_DIR: /data/uploads
    volumes:
      - upload_data:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build: ./frontend
    ports:
      - "${CC_PUBLISH_PORT:-3042}:8080"
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:

volumes:
  db_data:
  upload_data:
